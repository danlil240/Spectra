name: Release

on:
  push:
    tags: ['v*']

# Least privilege by default; jobs that publish raise their own permissions.
permissions:
  contents: read

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── Gate: the tagged commit must have a green CI run ──────────────────
  # Waits for the CI workflow (ci.yml) run on the tagged SHA and fails unless it
  # concluded "success". If the tag points at a commit CI never ran on, start CI
  # for it with "Run workflow" on the tag (ci.yml has workflow_dispatch), then
  # re-run this workflow.
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI success on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          no_run_grace=$(( 10 * 60 ))    # CI may start a little after the tag push
          deadline=$(( 140 * 60 ))
          while :; do
            now=$(date +%s)
            run_json="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty')"
            if [ -z "$run_json" ]; then
              if [ $(( now - start )) -gt "$no_run_grace" ]; then
                echo "::error::No CI run exists for $SHA. Run the CI workflow on this tag, then re-run Release."
                exit 1
              fi
              echo "No CI run for $SHA yet; waiting..."
              sleep 30
              continue
            fi
            status="$(jq -r .status <<<"$run_json")"
            conclusion="$(jq -r .conclusion <<<"$run_json")"
            url="$(jq -r .html_url <<<"$run_json")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for $SHA: $url"
                exit 0
              fi
              echo "::error::CI for $SHA concluded '$conclusion': $url"
              exit 1
            fi
            if [ $(( now - start )) -gt "$deadline" ]; then
              echo "::error::Timed out waiting for CI ($status): $url"
              exit 1
            fi
            echo "CI is $status: $url"
            sleep 60
          done

  # ─── Linux Packages (.deb, .rpm, .tar.gz, AppImage) ────────────────────
  package-linux:
    needs: ci-gate
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu22.04
            docker_tag: "22.04"
            codename: jammy
          - os: ubuntu-24.04
            label: ubuntu24.04
            docker_tag: "24.04"
            codename: noble
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          # Spectra uses C++20 <format>, which requires GCC 13+. Ubuntu 22.04
          # ships GCC 11 by default, so pull GCC 13 from the toolchain PPA there.
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 \
            g++-13 \
            libvulkan-dev \
            vulkan-validationlayers \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            glslang-tools \
            python3-pillow \
            ffmpeg \
            rpm

      - name: Configure + Build
        run: |
          # Statically link libstdc++/libgcc so the newer GCC 13 C++ runtime
          # (needed by <format>) is embedded in the binaries. This keeps the
          # resulting .deb installable on stock distros without a newer
          # libstdc++6 dependency.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DSPECTRA_BUILD_TESTS=OFF \
            -DSPECTRA_BUILD_EXAMPLES=OFF \
            -DSPECTRA_PKG_DISTRO_CODENAME=${{ matrix.codename }}
          cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(nproc)"

      - name: Package
        run: |
          cd build
          cpack -G TGZ
          cpack -G DEB
          # RPM must build: a broken RPM fails the release instead of silently
          # disappearing from the assets (CI builds it on ubuntu-22.04 too).
          cpack -G RPM

      - name: Inspect DEB metadata
        run: |
          for f in build/*.deb; do
            echo "==== $f ===="
            dpkg-deb -I "$f" | sed -n '1,120p'
          done

      - name: Smoke-test DEB install (clean container)
        run: |
          # Build a throwaway container from a clean base image to verify
          # the .deb installs without any pre-existing build dependencies.
          cat > /tmp/Dockerfile.deb-test <<'DOCKEOF'
          FROM ubuntu:${{ matrix.docker_tag }}
          COPY *.deb /tmp/
          RUN apt-get update \
              && apt-get install -y --no-install-recommends /tmp/*.deb \
              && rm -rf /var/lib/apt/lists/*
          RUN spectra --version
          RUN spectra-backend --version
          RUN ! ldd "$(command -v spectra)" | grep -q "not found"
          RUN ! ldd "$(command -v spectra-backend)" | grep -q "not found"
          DOCKEOF
          docker build -f /tmp/Dockerfile.deb-test -t spectra-deb-smoke build/

      - name: Build AppImage
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          test -f "${GITHUB_WORKSPACE}/packaging/AppImage/build-appimage.sh"
          bash "${GITHUB_WORKSPACE}/packaging/AppImage/build-appimage.sh" build

      - name: Normalize Linux artifact names
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          mkdir -p artifacts
          for f in build/*.deb; do
            ARCH=$(dpkg-deb -f "$f" Architecture)
            cp "$f" "artifacts/spectra_${VERSION}_${ARCH}_${{ matrix.label }}.deb"
          done
          for f in build/*.tar.gz; do
            b="$(basename "$f" .tar.gz)"
            cp "$f" "artifacts/${b}_${{ matrix.label }}.tar.gz"
          done
          for f in build/*.rpm; do
            [ -f "$f" ] || continue
            b="$(basename "$f" .rpm)"
            cp "$f" "artifacts/${b}_${{ matrix.label }}.rpm"
          done
          for f in build/*.AppImage; do
            b="$(basename "$f" .AppImage)"
            cp "$f" "artifacts/${b}_${{ matrix.label }}.AppImage"
          done
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages-${{ matrix.label }}
          path: artifacts/*

  # ─── macOS Package (.tar.gz) ────────────────────────────────────────────
  package-macos:
    needs: ci-gate
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install vulkan-headers vulkan-loader glslang molten-vk
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python -c "from PIL import Image; print(f'Pillow {Image.__version__} installed')"
          echo "PYTHON_VENV=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Configure + Build
        run: |
          source .venv/bin/activate
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DPython3_EXECUTABLE:FILEPATH="$PYTHON_VENV" \
            -DSPECTRA_BUILD_TESTS=OFF \
            -DSPECTRA_BUILD_EXAMPLES=OFF
          cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          cd build
          cpack -G TGZ

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.os }}-${{ matrix.arch }}-packages
          path: build/*.tar.gz

  # ─── Windows Package (.zip, EXPERIMENTAL C++ library/app only) ──────────
  # The multiproc backend does not run on Windows (no Unix domain socket
  # daemon), so no Windows Python wheel or backend archive is published.
  package-windows:
    needs: ci-gate
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = "1.4.304.1"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -Args "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          $pythonExe = Join-Path $PWD ".venv\Scripts\python.exe"
          & $pythonExe -m pip install --upgrade pip
          & $pythonExe -m pip install Pillow
          & $pythonExe -c "from PIL import Image; print(f'Pillow {Image.__version__} installed')"
          "PYTHON_VENV=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure + Build
        shell: pwsh
        run: |
          $pythonExe = (Resolve-Path "${env:PYTHON_VENV}").Path
          cmake -B build `
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
            "-DPython3_EXECUTABLE:FILEPATH=$pythonExe" `
            "-DSPECTRA_BUILD_TESTS=OFF" `
            "-DSPECTRA_BUILD_EXAMPLES=OFF"
          cmake --build build --config ${{ env.BUILD_TYPE }} -j $env:NUMBER_OF_PROCESSORS

      - name: Package
        run: |
          cd build
          cpack -G ZIP

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages
          path: build/*.zip

  # ─── Python Wheels (cibuildwheel) ───────────────────────────────────────
  # Windows wheels are not built: the Python package drives the multiproc
  # backend, which exits with "Unix domain socket daemon not supported" there.
  python-wheels:
    needs: ci-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            vulkan-validationlayers \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            glslang-tools

      - name: Install Vulkan SDK (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-headers vulkan-loader glslang molten-vk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32 pp*"
          CIBW_BUILD_VERBOSITY: 1
          # No GPU in the test environment: import + version check, and verify the
          # multiproc binaries are bundled at spectra/_bin/.
          CIBW_TEST_COMMAND: >-
            python -c "import spectra, sys; print(spectra.__version__)" &&
            python {project}/.github/scripts/check_wheel.py {project}/version.txt
          # manylinux_2_34 is currently emitting x86_64_v2 ISA notes for our wheel.
          # Use manylinux_2_28 for a stable x86_64 baseline auditwheel target.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # spectra/_bin/spectra-backend and spectra-window link the Vulkan loader;
          # it must come from the user's system (it finds the system ICDs), so
          # auditwheel must not graft libvulkan into the wheel.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude libvulkan.so.1 -w {dest_dir} {wheel}
          # manylinux_2_28's default gcc-toolset-12 lacks C++20 <format>; use
          # gcc-toolset-13 (installed in CIBW_BEFORE_ALL_LINUX) instead.
          CIBW_ENVIRONMENT_LINUX: >
            CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++
            PATH=/opt/rh/gcc-toolset-13/root/usr/bin:$PATH
            CFLAGS="-march=x86-64 -mtune=generic"
            CXXFLAGS="-march=x86-64 -mtune=generic"
            CMAKE_ARGS="-DCMAKE_C_FLAGS=-march=x86-64 -DCMAKE_CXX_FLAGS=-march=x86-64"
          CIBW_BEFORE_ALL_LINUX: >
            dnf -y install git cmake ninja-build gcc-toolset-13 &&
            git clone https://github.com/KhronosGroup/glslang.git --depth 1 --branch 14.2.0 &&
            cd glslang && 
            mkdir build && cd build && 
            cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=0 .. && 
            ninja && 
            cp StandAlone/glslang /usr/local/bin/glslangValidator && 
            cd / && 
            rm -rf /glslang && 
            dnf -y install
            vulkan-loader-devel
            vulkan-headers
            mesa-libGL-devel
            libXrandr-devel
            libXinerama-devel
            libXcursor-devel
            libXi-devel
            libxkbcommon-devel
            wayland-devel
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=15.0
            CFLAGS="-mmacosx-version-min=15.0"
            CXXFLAGS="-mmacosx-version-min=15.0"
            CMAKE_ARGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0"
          # (CIBW_BUILD_MACOS / CIBW_REPAIR_MACOS / *_MACOS_ARM64 were removed: they are
          # not cibuildwheel options and were silently ignored, so macOS wheels have
          # always used the default delocate repair, which stays unchanged.)

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ─── Linux wheel render smoke (lavapipe) ──────────────────────────────
  # cibuildwheel's manylinux test container has no Xvfb/lavapipe, so the real
  # "start the bundled backend and render" check runs here on the built wheel.
  wheel-smoke-linux:
    needs: python-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install lavapipe + Xvfb
        uses: ./.github/actions/setup-linux

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Download Linux wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels-ubuntu-24.04
          path: wheelhouse/

      - name: Install cp312 wheel
        run: |
          set -euo pipefail
          whl="$(ls wheelhouse/*-cp312-cp312-*manylinux*.whl)"
          python -m pip install "$whl"

      - name: Pin Vulkan ICD to lavapipe
        uses: ./.github/actions/pin-lavapipe

      - name: Render smoke test from the installed wheel
        env:
          SPECTRA_NO_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # make sure the installed package is imported, not the checkout
          python -I "$GITHUB_WORKSPACE/.github/scripts/check_wheel.py" "$GITHUB_WORKSPACE/version.txt"
          rc=0
          timeout 300 xvfb-run -a python -I "$GITHUB_WORKSPACE/python/tests/wheel_smoke.py" || rc=$?
          pkill -f spectra-backend || true
          exit "$rc"

  # ─── Python sdist ──────────────────────────────────────────────────────
  python-sdist:
    needs: ci-gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist --outdir dist/ .
          # The sdist builds the backend with CMake, so it must carry the C++ tree.
          sdist="$(ls dist/*.tar.gz)"
          tar tzf "$sdist" > sdist-files.txt
          for f in version.txt CMakeLists.txt pyproject.toml python/spectra/__init__.py; do
            grep -q "^[^/]*/$f\$" sdist-files.txt || { echo "::error::$f missing from $sdist"; exit 1; }
          done

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # ─── Standalone Backend Binaries (for pure-Python pip install) ──────────
  backend-binaries:
    needs: ci-gate
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          # Spectra uses C++20 <format>, which requires GCC 13+. Ubuntu 22.04
          # ships GCC 11 by default, so pull GCC 13 from the toolchain PPA there.
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 \
            g++-13 \
            libvulkan-dev \
            vulkan-validationlayers \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            glslang-tools \
            python3-pillow

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install vulkan-headers vulkan-loader glslang molten-vk
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python -c "from PIL import Image; print(f'Pillow {Image.__version__} installed')"
          echo "PYTHON_VENV=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Configure + Build (multiproc)
        run: |
          python_args=()
          if [ -n "${PYTHON_VENV:-}" ]; then
            python_args=(-DPython3_EXECUTABLE:FILEPATH="$PYTHON_VENV")
          fi
          # On Linux, build with GCC 13 (for C++20 <format>) and statically link
          # the C++ runtime so the backend binaries stay portable.
          toolchain_args=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            toolchain_args=(
              -DCMAKE_C_COMPILER=gcc-13
              -DCMAKE_CXX_COMPILER=g++-13
              -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
              -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
            )
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            "${python_args[@]}" \
            "${toolchain_args[@]}" \
            -DSPECTRA_BUILD_TESTS=OFF \
            -DSPECTRA_BUILD_EXAMPLES=OFF \
            -DSPECTRA_RUNTIME_MODE=multiproc
          cmake --build build --config ${{ env.BUILD_TYPE }} -j4
        shell: bash

      - name: Package backend binaries
        run: |
          mkdir -p pkg
          cp build/spectra-backend pkg/
          cp build/spectra-window pkg/
          tar czf spectra-backend-${{ matrix.platform }}.tar.gz -C pkg .

      - name: Upload backend binary archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ matrix.platform }}
          path: spectra-backend-${{ matrix.platform }}.*

  # ─── Create GitHub Release ─────────────────────────────────────────────
  release:
    needs: [package-linux, package-macos, package-windows, python-wheels, wheel-smoke-linux, python-sdist, backend-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Read version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version.txt ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Homebrew and AUR build from the GitHub source tarball of the tag; fill in
      # its real sha256 and attach the rendered manifests as release assets.
      # (Scoop is skipped: its manifest only ships the multiproc backend .exe
      # files, which do not work on Windows.)
      - name: Render package manifests (Homebrew, AUR)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/source.tar.gz" \
            "https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          sha="$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)"
          echo "source tarball sha256: $sha"
          python3 .github/scripts/render_manifests.py \
            --version "$VERSION" --tag "$TAG" --source-sha256 "$sha" \
            --repo "$REPO" --out dist/

      - name: Check GPG key availability
        id: gpg_check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY secret not set — skipping artifact signing"
          fi

      - name: Import GPG key
        if: steps.gpg_check.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d':' -f10)
          echo "$GPG_FINGERPRINT:6:" | gpg --import-ownertrust

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: GPG-sign checksums and artifacts
        if: steps.gpg_check.outputs.available == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist
          # Sign the checksums file
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor SHA256SUMS
          # Sign each binary artifact
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            [ "$f" = "SHA256SUMS.asc" ] && continue
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$f"
          done
          echo "--- Signed artifacts ---"
          ls -la *.asc

      - name: Export GPG public key
        if: steps.gpg_check.outputs.available == 'true'
        run: |
          gpg --armor --export "$GPG_KEY_ID" > dist/spectra-release-signing-key.asc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Spectra v${{ steps.version.outputs.version }}
          body: |
            ## Spectra v${{ steps.version.outputs.version }}

            ### Installation

            **Python (Linux x86_64, macOS):**
            ```
            pip install spectra-plot
            ```
            Windows is not supported by the Python package (the multiproc backend
            needs Unix domain sockets).

            **Linux (.deb):**
            ```
            sudo apt update
            sudo apt install -y ./spectra_${{ steps.version.outputs.version }}_amd64_ubuntu22.04.deb
            # or:
            sudo apt install -y ./spectra_${{ steps.version.outputs.version }}_amd64_ubuntu24.04.deb
            ```

            **Linux (.rpm, AppImage, .tar.gz):** see the assets below.

            **macOS (Homebrew, builds from source):** `spectra.rb` with the source
            sha256 filled in is attached; add it to a tap and `brew install spectra`.

            **Arch Linux (AUR):** `PKGBUILD` with the source sha256 is attached.

            **Windows (experimental):** `spectra-${{ steps.version.outputs.version }}-win64.zip`
            contains the C++ library and in-process app only. It is built but not
            tested on real GPUs, and the multiproc backend does not run on Windows.

            **From source:**
            ```
            cmake -B build && cmake --build build && sudo cmake --install build
            ```

            ### Verifying Downloads

            All release artifacts are GPG-signed. To verify:

            **1. Import the signing key:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/spectra-release-signing-key.asc | gpg --import
            ```

            **2. Verify checksums file:**
            ```bash
            gpg --verify SHA256SUMS.asc SHA256SUMS
            ```

            **3. Verify file integrity:**
            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            **4. Or verify an individual artifact:**
            ```bash
            gpg --verify spectra_${{ steps.version.outputs.version }}_amd64_ubuntu24.04.deb.asc \
                         spectra_${{ steps.version.outputs.version }}_amd64_ubuntu24.04.deb
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ─── Publish to PyPI (Trusted Publishing / OIDC) ─────────────────────────
  publish-pypi:
    needs: [release]
    runs-on: ubuntu-24.04
    if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta')"
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          pattern: sdist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

  # ─── APT Repository (GitHub Pages) ────────────────────────────────────────
  apt-repo:
    needs: [release]
    runs-on: ubuntu-24.04
    if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'rc')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: debs/
          pattern: linux-packages-*
          merge-multiple: true

      - name: Check GPG key availability
        id: gpg_check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::GPG_PRIVATE_KEY secret is required for APT repo signing"
            exit 1
          fi

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep fpr | head -1 | cut -d':' -f10)
          echo "$GPG_FINGERPRINT:6:" | gpg --import-ownertrust

      - name: Install reprepro
        run: sudo apt-get install -y reprepro

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-tree origin/gh-pages
          else
            # First time: create orphan gh-pages branch
            git worktree add --orphan -b gh-pages gh-pages-tree
          fi

      - name: Set up APT repo structure
        run: |
          # Clear old reprepro database (codenames may have changed)
          rm -rf gh-pages-tree/apt/db gh-pages-tree/apt/dists gh-pages-tree/apt/pool
          mkdir -p gh-pages-tree/apt/conf
          # Copy reprepro config (update SignWith to use our key)
          sed "s/SignWith: yes/SignWith: $GPG_KEY_ID/" \
            packaging/apt/distributions > gh-pages-tree/apt/conf/distributions
          cp packaging/apt/options gh-pages-tree/apt/conf/options

      - name: Add packages to APT repo
        run: |
          cd gh-pages-tree/apt
          for deb in ../../debs/*.deb; do
            # Route to correct distribution based on Ubuntu version in filename
            if [[ "$deb" == *ubuntu22.04* ]]; then
              codename="jammy"
            elif [[ "$deb" == *ubuntu24.04* ]]; then
              codename="noble"
            else
              echo "WARNING: Unknown distro for $deb, skipping"
              continue
            fi
            echo "Adding $deb to $codename"
            reprepro -Vb . --confdir ./conf includedeb "$codename" "$deb"
          done

          # Export public key so apt clients can verify the repo
          gpg --armor --export "$GPG_KEY_ID" > spectra-archive-keyring.asc

      - name: Copy apt README
        run: cp packaging/apt/README.md gh-pages-tree/apt/README.md

      - name: Commit and push gh-pages
        run: |
          cd gh-pages-tree
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "apt: add packages for ${{ github.ref_name }}"
          git push origin HEAD:gh-pages
