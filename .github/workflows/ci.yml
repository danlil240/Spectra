name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Golden image tests fail (instead of skipping) when a baseline is missing.
  SPECTRA_GOLDEN_STRICT: "1"

jobs:
  # ─── clang-format (changed lines only) ──────────────────────────────────
  # The tree is not fully clang-format clean yet, so only the lines a PR / push
  # touches are checked. Fix locally with `git clang-format <base>` or
  # `./format_project.sh` (whole tree).
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting of changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="${PUSH_BEFORE_SHA:-}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "Checking lines changed between $base and $GITHUB_SHA"
          if ! git clang-format-18 --binary clang-format-18 --extensions c,cc,cpp,cxx,h,hh,hpp,hxx,inl,m,mm --diff "$base" "$GITHUB_SHA" \
               -- src include tests examples; then
            echo "::error::Changed lines are not clang-format clean. Run: git clang-format-18 $base"
            exit 1
          fi

      # UI colours must come from ThemeManager tokens so panels stay readable in
      # every theme. Approved exceptions: tools/color_literals_allowlist.txt.
      - name: Check for hard-coded UI colour literals
        run: python3 tools/check_color_literals.py

  # ─── Build + Unit Tests (Linux) ─────────────────────────────────────────
  build-linux:
    name: build-linux (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            cxxflags: "-Wall -Wextra -Werror"
            linker_flags: ""
            toolchain_ppa: "false"
            examples: "ON"
            golden: "ON"
            gpu_tests: true
            package: false
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-17
            cxx: clang++-17
            cxxflags: "-Wall -Wextra -Werror"
            linker_flags: ""
            toolchain_ppa: "false"
            examples: "ON"
            golden: "ON"
            gpu_tests: true
            package: false
          # Mirrors the release package-linux ubuntu-22.04 job exactly (gcc-13 from
          # the toolchain PPA, static libstdc++/libgcc, jammy codename) but with tests
          # ON, so release-only breakages show up before tagging.
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            cxxflags: ""
            linker_flags: "-static-libstdc++ -static-libgcc"
            toolchain_ppa: "true"
            examples: "OFF"
            golden: "OFF"
            gpu_tests: false
            package: true
            codename: jammy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/setup-linux
        with:
          toolchain-ppa: ${{ matrix.toolchain_ppa }}
          extra-packages: >-
            ${{ matrix.toolchain_ppa == 'true' && 'gcc-13 g++-13 rpm ffmpeg' || '' }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: build-linux-${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}

      - name: Configure CMake
        env:
          CXXFLAGS_EXTRA: ${{ matrix.cxxflags }}
          LINKER_FLAGS: ${{ matrix.linker_flags }}
          CODENAME: ${{ matrix.codename }}
        run: |
          extra=()
          if [ -n "$CODENAME" ]; then
            extra+=(-DSPECTRA_PKG_DISTRO_CODENAME="$CODENAME")
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS_EXTRA" \
            -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAGS" \
            -DSPECTRA_USE_ROS2=OFF \
            -DSPECTRA_BUILD_TESTS=ON \
            -DSPECTRA_BUILD_EXAMPLES=${{ matrix.examples }} \
            -DSPECTRA_BUILD_GOLDEN_TESTS=${{ matrix.golden }} \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(nproc)"

      - name: Pin Vulkan ICD to lavapipe
        uses: ./.github/actions/pin-lavapipe

      - name: Run unit tests (non-GPU)
        run: ctest --test-dir build --output-on-failure -LE "gpu|golden" -j"$(nproc)"

      - name: Run unit tests (GPU, serial)
        if: matrix.gpu_tests
        run: ctest --test-dir build --output-on-failure -L "gpu" -LE "golden" -j1

      - name: Package (release smoke)
        if: matrix.package
        run: |
          cd build
          cpack -G TGZ
          cpack -G DEB
          cpack -G RPM
          ls -la ./*.tar.gz ./*.deb ./*.rpm

  # ─── Python package + pytest (also the SPECTRA_BUILD_EMBED_SHARED build) ──
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/setup-linux

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Cheap guard so a broken example (e.g. a stray indent) fails fast, before the build.
      - name: Byte-compile Python examples
        run: python -m py_compile python/examples/*.py

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: python-tests-ubuntu-24.04
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}

      # Build only what the Python tests talk to: the multiproc backend + window
      # agent, and libspectra_embed.so for the ctypes embed API.
      - name: Build backend + embed library
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPECTRA_USE_ROS2=OFF \
            -DSPECTRA_BUILD_TESTS=OFF \
            -DSPECTRA_BUILD_EXAMPLES=OFF \
            -DSPECTRA_BUILD_GOLDEN_TESTS=OFF \
            -DSPECTRA_BUILD_EMBED_SHARED=ON \
            -DSPECTRA_RUNTIME_MODE=multiproc
          cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(nproc)" \
            --target spectra-backend spectra-window spectra_embed
          ls -la build/spectra-backend build/spectra-window build/libspectra_embed.so

      # Root pyproject.toml is the only Python project. wheel.cmake=false skips the
      # scikit-build CMake run (the backend was built above), so this is a plain
      # editable install of python/spectra plus the [dev] extras.
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --config-settings=wheel.cmake=false
          python -c "import spectra; print('spectra', spectra.__version__, spectra.__file__)"

      - name: Pin Vulkan ICD to lavapipe
        uses: ./.github/actions/pin-lavapipe

      - name: pytest (xvfb + lavapipe)
        env:
          SPECTRA_BACKEND_PATH: ${{ github.workspace }}/build/spectra-backend
          SPECTRA_EMBED_LIB: ${{ github.workspace }}/build/libspectra_embed.so
          PYTHONFAULTHANDLER: "1"
        run: xvfb-run -a python -m pytest python/tests -v -rs --durations=20

  # ─── Build + Unit Tests (macOS) ─────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-15     # ARM (M-series)
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install vulkan-headers vulkan-loader glslang molten-vk glfw
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python -c "from PIL import Image; print(f'Pillow {Image.__version__} installed')"
          echo "PYTHON_VENV=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          source .venv/bin/activate
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DPython3_EXECUTABLE:FILEPATH="$PYTHON_VENV" \
            -DSPECTRA_BUILD_TESTS=ON \
            -DSPECTRA_BUILD_EXAMPLES=ON \
            -DSPECTRA_BUILD_GOLDEN_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(sysctl -n hw.ncpu)"

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -LE gpu -j"$(sysctl -n hw.ncpu)"

  # ─── Build + Unit Tests (Windows, experimental C++ only) ────────────────
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = "1.4.304.1"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -Args "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          $pythonExe = Join-Path $PWD ".venv\Scripts\python.exe"
          & $pythonExe -m pip install --upgrade pip
          & $pythonExe -m pip install Pillow
          & $pythonExe -c "from PIL import Image; print(f'Pillow {Image.__version__} installed')"
          "PYTHON_VENV=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          $pythonExe = (Resolve-Path "${env:PYTHON_VENV}").Path
          cmake -B build `
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
            "-DPython3_EXECUTABLE:FILEPATH=$pythonExe" `
            "-DSPECTRA_BUILD_TESTS=ON" `
            "-DSPECTRA_BUILD_EXAMPLES=ON" `
            "-DSPECTRA_BUILD_GOLDEN_TESTS=OFF"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $env:NUMBER_OF_PROCESSORS

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -LE gpu -C ${{ env.BUILD_TYPE }} -j $env:NUMBER_OF_PROCESSORS

  # ─── Golden Image Tests (lavapipe software Vulkan) ───────────────────────
  golden-tests:
    runs-on: ubuntu-24.04
    needs: build-linux
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies + lavapipe
        uses: ./.github/actions/setup-linux
        with:
          extra-packages: mesa-utils

      - name: Verify lavapipe
        run: |
          echo "Available Vulkan ICDs:"
          ls /usr/share/vulkan/icd.d/ 2>/dev/null || true
          vulkaninfo --summary || echo "vulkaninfo not available, continuing..."

      - name: Pin Vulkan ICD to lavapipe
        uses: ./.github/actions/pin-lavapipe

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: golden-tests-ubuntu-24.04
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}

      - name: Configure + Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPECTRA_USE_ROS2=OFF \
            -DSPECTRA_BUILD_TESTS=ON \
            -DSPECTRA_BUILD_GOLDEN_TESTS=ON \
            -DSPECTRA_BUILD_EXAMPLES=OFF
          cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(nproc)"

      - name: Run golden image tests
        env:
          SPECTRA_UPDATE_BASELINES: "0"
          SPECTRA_GOLDEN_STRICT: "1"
          SPECTRA_GOLDEN_BASELINE_DIR: ${{ github.workspace }}/tests/golden/baseline
          SPECTRA_GOLDEN_OUTPUT_DIR: ${{ github.workspace }}/tests/golden/output
        run: |
          rm -rf tests/golden/output
          mkdir -p tests/golden/output
          cd build
          xvfb-run -a ctest --output-on-failure -L golden -j1 --repeat until-pass:2

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-test-output
          path: tests/golden/output/
          retention-days: 14

  # ─── Sanitizers (ASan / UBSan / TSan) ───────────────────────────────────
  sanitizers:
    name: sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: address
            cflags: ""
            test_filter: ""
          - sanitizer: undefined
            cflags: ""
            test_filter: ""
          - sanitizer: thread
            # Instrument C code too (vendored C libs), otherwise TSan reports
            # false positives through uninstrumented synchronisation.
            cflags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
            # Excluded (not data races): PluginGuard.CatchSegfault and the
            # diagnostics tests raise SIGSEGV on purpose; plugin_guard_invoke()
            # siglongjmps out of the handler and then allocates, which TSan
            # reports as "signal-unsafe call inside of a signal".
            test_filter: "unit_test_plugin_guard|unit_test_plugin_diagnostics"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/setup-linux
        with:
          extra-packages: libglu1-mesa-dev

      # Ubuntu 24.04 runner kernels use 32 bits of mmap ASLR entropy, which TSan
      # (and sometimes ASan) cannot map its shadow memory around.
      - name: Lower mmap ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: sanitizers-${{ matrix.sanitizer }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}

      - name: Configure with sanitizer
        env:
          SAN_CFLAGS: ${{ matrix.cflags }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_CFLAGS" \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
            -DSPECTRA_BUILD_TESTS=ON \
            -DSPECTRA_BUILD_GOLDEN_TESTS=OFF \
            -DSPECTRA_BUILD_EXAMPLES=OFF \
            -DSPECTRA_USE_ROS2=OFF

      - name: Build
        run: cmake --build build --config Debug -j"$(nproc)"

      - name: Run tests under sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/sanitizers/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=4
          TEST_FILTER: ${{ matrix.test_filter }}
        run: |
          filter=()
          if [ -n "$TEST_FILTER" ]; then
            filter=(-E "$TEST_FILTER")
          fi
          ctest --test-dir build --output-on-failure -LE gpu -j"$(nproc)" "${filter[@]}"

  # ─── ROS2 Adapter Build (Humble + Jazzy) ───────────────────────────────────
  build-ros2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ROS2 dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y \
            gcc-13 \
            g++-13 \
            libvulkan-dev \
            libglfw3-dev \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            glslang-tools \
            nlohmann-json3-dev \
            libtinyxml2-dev \
            python3-pillow \
            xvfb \
            mesa-vulkan-drivers \
            vulkan-tools

      - name: Pin Vulkan ICD to lavapipe
        uses: ./.github/actions/pin-lavapipe

      - name: Configure CMake with ROS2
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DSPECTRA_USE_ROS2=ON \
            -DSPECTRA_ROS2_BAG=ON \
            -DSPECTRA_BUILD_TESTS=ON \
            -DSPECTRA_BUILD_QA_AGENT=ON \
            -DSPECTRA_BUILD_BENCHMARKS=ON \
            -DSPECTRA_BUILD_EXAMPLES=OFF \
            -DSPECTRA_BUILD_GOLDEN_TESTS=OFF

      - name: Build ROS2 adapter
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j"$(nproc)"

      - name: Run ROS2 unit tests
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          # Serial: ROS2 test binaries share one DDS domain; parallel ctest races discovery.
          ctest --test-dir build -L ros2 -LE gpu --output-on-failure -j1

      - name: Headless bag CSV export (Phase B9)
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          python3 scripts/generate_ros_reference_bags.py
          ./build/spectra-ros-analyze \
            --bag tests/data/ros_bags/imu_snippet \
            --fields /imu/data.linear_acceleration.z \
            --csv /tmp/imu_z.csv
          test "$(wc -l < /tmp/imu_z.csv)" -eq 61

      - name: ROS 3D perf smoke (Phase C4)
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          ./build/tests/bench_ros3d \
            --benchmark_filter='BM_PointCloud(Display|Adapter).*500000' \
            --benchmark_min_time=0.05s

      # GUI spectra_ros_qa_agent scenarios (nav_spatiotemporal, design_review) are
      # validated locally with Xvfb — lavapipe CI runners cannot complete them in
      # reasonable time.  See tests/qa/ros_qa_agent.cpp and AGENTS.md.
