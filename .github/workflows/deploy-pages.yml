name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy Pages whenever the Release workflow updates the gh-pages branch.
  # A GITHUB_TOKEN push from a workflow does NOT re-trigger push events, so
  # this workflow_run trigger is the reliable way to pick up apt-repo updates.
  # Do not branch-filter this event: the Release workflow is tag-triggered.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout apt repo from gh-pages
        run: |
          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-tree origin/gh-pages
          fi

      - name: Install Doxygen
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      # docs/Doxyfile (owned by the docs) writes docs/api/html; the HTML pages
      # link to api/html/index.html.
      - name: Generate API docs (Doxygen)
        run: |
          set -euo pipefail
          rm -rf docs/api
          doxygen docs/Doxyfile 2> doxygen-warnings.log
          test -f docs/api/html/index.html
          echo "Doxygen warnings: $(wc -l < doxygen-warnings.log)"

      # Explicit allow-list: docs/ also holds internal material (plans/, archive/,
      # marketing/, workshops/, dev/, scripts/, review notes, dated walkthroughs,
      # SVG/.mjs diagram sources) that must not be published. Anything not listed
      # here stays off the public site.
      - name: Assemble site (allow-list)
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf _site
          mkdir -p _site
          copy() {   # copy docs/<path> to _site/<path>
            mkdir -p "_site/$(dirname "$1")"
            cp "docs/$1" "_site/$1"
          }
          for f in docs/*.html; do copy "${f#docs/}"; done
          copy styles.css
          for f in docs/images/diagrams/*.png docs/images/figma/*.png docs/images/screenshots/*; do
            [ -f "$f" ] && copy "${f#docs/}"
          done
          # User-facing Markdown pages that the HTML pages link to.
          for f in topics.md easy_embed_guide.md plugin_developer_guide.md ci/bag-analysis.md \
                   architecture.md getting_started.md; do
            if [ -f "docs/$f" ]; then copy "$f"; else echo "::warning::docs/$f not found"; fi
          done
          mkdir -p _site/api
          cp -r docs/api/html _site/api/html
          if [ -d gh-pages-tree/apt ]; then
            mkdir -p _site/apt
            cp -r gh-pages-tree/apt/. _site/apt/
          fi

      - name: Refuse internal material
        run: |
          set -euo pipefail
          leaked="$(find _site \( -path '_site/apt' -o -path '_site/api' \) -prune -o \( \
            -path '*/plans/*' -o -path '*/archive/*' -o -path '*/marketing/*' \
            -o -path '*/workshops/*' -o -path '*/dev/*' -o -path '*/scripts/*' \
            -o -name 'ARCHITECTURE_REVIEW_V3.md' -o -name '2026-04-04-*' -o -name 'Doxyfile' \
            -o -name 'api-mainpage.md' -o -name '*.mjs' -o -name '*.svg' \) -print)"
          if [ -n "$leaked" ]; then
            echo "::error::Internal docs would be published:"
            echo "$leaked"
            exit 1
          fi
          find _site \( -path '_site/api' -o -path '_site/apt' \) -prune -o -type f -print | sort

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
